<div class="container mt-4 ">

  <div class="d-flex justify-content-center mb-4">
    <input
      type="date"
      class="form-control w-auto me-2"
      [(ngModel)]="selectedDate"
    />

    <button class="btn btn-success" (click)="filter()">
      Filter
    </button>
  </div>

  <div class="card shadow-sm">
  <table class="table mb-0" *ngIf="displayedTransactions.length > 0">
    <thead class="table-light">
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Type</th>
        <th (click)="sortByAmount()" style="cursor:pointer">
          Amount ($)
        </th>
        <th>Available Balance</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let t of displayedTransactions">
        <td>{{ t.date | date:'dd-MM-yyyy' }}</td>
        <td>{{ t.description }}</td>
        <td>{{ t.type === 0 ? 'Credit' : 'Debit' }}</td>
        <td>{{ t.amount }}</td>
        <td>{{ t.balance }}</td>
      </tr>
    </tbody>
  </table>
  <p class="text-center p-3" *ngIf="displayedTransactions.length === 0">
      No Record Found.
    </p>
</div>

</div>
